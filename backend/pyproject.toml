[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Dallas-White", email = "dallas-white@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "email-validator==2.3.0",
    "flask==3.1.3",
    "gunicorn==26.0.0",
    "mysql-connector-python==9.7.0",
    "pypdf==6.13.2",
    "reportlab==4.5.1",
    "resend==2.30.1",
    "werkzeug==3.1.8",
]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-flask>=1.3.0",
    "testcontainers[mysql]>=4.15.0",
]


[tool.pyrefly.errors]
unknown-variable-type = "warn"
unknown-argument-type = "warn"
unknown-attribute-type = "warn"
implicit-any-parameter = "warn"
implicit-any-lambda = "warn"
